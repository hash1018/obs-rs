name: Set up FFmpeg
description: >
  Exports FFMPEG_DIR pointing at a pinned FFmpeg 8.0 development tree, built
  from vcpkg on a miss and restored from the Actions cache on a hit.

  A copy of the same action in `hash1018/media-pp`, deliberately, rather than
  a reference to it. What FFmpeg this repository builds against decides what a
  release archive bundles and therefore what its licence obligations are, and
  that is not something another repository's CI should be able to change
  underneath a release. Kept in step by hand when it needs to be.

inputs:
  vcpkg-ref:
    description: >
      The microsoft/vcpkg tag to build the FFmpeg port from.

      ffmpeg-next 8.1 supports FFmpeg through 8.0, and the rolling vcpkg
      installation on hosted runners has moved past that. This tag's ffmpeg
      port is 8.0.1, the same version this crate is developed against.
      Upstream prebuilt binaries are no longer an escape hatch either: BtbN
      prunes its autobuilds and now ships only the 8.1 and 9.0 lines, so this
      immutable git tag is the one reproducible source of a matching FFmpeg.
    required: false
    default: "2026.01.16"
  vcpkg-features:
    description: >
      Comma-separated vcpkg features to add to the default `ffmpeg` port
      install (e.g. "openh264").

      `openh264` is what obs-rs encodes H.264 with where no hardware encoder
      is available, so a build without it has no software fallback. It is also
      what keeps the bundled FFmpeg non-GPL: x264 is the obvious alternative
      and it is GPL, which would change the terms a release archive is
      distributed under. See `THIRD-PARTY.md`.

      `nvcodec` is NVIDIA's encode, decode and CUDA support. The Linux
      backend opens its CUDA device through FFmpeg and composites on it, and
      a build without this has no CUDA device type to open. On Windows it is
      what the NVENC encoder setting means; without it a recording falls
      back to Media Foundation (measured on the v0.2.0 draft archive). It
      adds only `ffnvcodec`, NVIDIA's MIT-licensed headers, which load the
      driver at run time.

      On Linux the port is also patched to build FFmpeg's CUDA filters: see
      the Linux install step below for why and how.

      Additive to vcpkg's default feature set, not a replacement for it — the
      defaults are already free of GPL components.
    required: false
    default: "openh264,nvcodec"

runs:
  using: composite
  steps:
    # Building FFmpeg from source costs tens of minutes on a hosted runner.
    # What it produces depends only on the ref above, which is immutable, so
    # the installed tree is cached under exactly that ref.
    #
    # No `restore-keys`: a prefix fallback would hand back a tree built from a
    # different ref, which is the one outcome the pin exists to prevent. A miss
    # must rebuild rather than approximate.
    #
    # A cache is readable from the ref that wrote it and from the default
    # branch, and nowhere else, and it is evicted after seven days without a
    # hit. What keeps this one alive and reachable is therefore the CI workflow
    # running on every push and pull request; the tag-triggered docs build
    # restores what those runs wrote rather than maintaining its own.
    # Both platforms use a dynamic triplet (x64-windows, x64-linux-dynamic):
    # linux's own default triplet (x64-linux) links statically, which would
    # trade the DLL-search problem below for chasing every transitive static
    # dependency (x264, opus, ...) FFmpeg's port pulls in.
    #
    # Split into restore + save (rather than the combined `actions/cache`
    # with `save-always`) because `save-always` never actually saved past a
    # later failed step and is now deprecated for exactly that reason. The
    # save step below sits inside this action's own steps, before control
    # returns to the caller, so it still runs even when the caller's later
    # lint/test steps fail.
    #
    # The key is made once, here, for both: a cache key may not contain a
    # comma, and a list of features is written with them.
    #
    # `PATCH` names what the Linux install step changes in the port, so a
    # tree built without that change is never restored as one built with it.
    # It is part of the key rather than of the ref because the ref is
    # vcpkg's, and this change is ours.
    - name: Name the FFmpeg cache
      id: key
      shell: bash
      env:
        TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows' || 'x64-linux-dynamic' }}
        REF: ${{ inputs.vcpkg-ref }}
        FEATURES: ${{ inputs.vcpkg-features }}
        PATCH: ${{ runner.os == 'Linux' && '-cuda-llvm' || '' }}
      run: echo "key=vcpkg-ffmpeg-$TRIPLET-$REF-${FEATURES//,/-}$PATCH" >> "$GITHUB_OUTPUT"

    - name: Restore cached FFmpeg development libraries
      id: ffmpeg
      uses: actions/cache/restore@v4
      with:
        path: .vcpkg/installed
        key: ${{ steps.key.outputs.key }}

    - name: Check out compatible vcpkg
      if: steps.ffmpeg.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        repository: microsoft/vcpkg
        ref: ${{ inputs.vcpkg-ref }}
        path: .vcpkg

    # vcpkg builds its ports from source on a miss; these are what its own
    # Linux CI installs first for exactly that. `clang` is ours, not vcpkg's:
    # it is what compiles FFmpeg's CUDA filters — see the Linux install step.
    - name: Install vcpkg build dependencies
      if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential curl zip unzip tar pkg-config \
          ninja-build nasm autoconf automake libtool python3 clang

    # The exit-code checks stop this step at the command that actually broke.
    # A native failure does not raise a PowerShell error, so without them the
    # script runs on and the step reports whichever command exited last.
    - name: Install FFmpeg development libraries (Windows)
      if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        & "$env:GITHUB_WORKSPACE\.vcpkg\bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed ($LASTEXITCODE)" }
        & "$env:GITHUB_WORKSPACE\.vcpkg\vcpkg.exe" install "ffmpeg[${{ inputs.vcpkg-features }}]:x64-windows"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg install ffmpeg failed ($LASTEXITCODE)" }
        # Nothing here links the debug variant, and it is about half of what
        # would otherwise be cached and restored on every later run.
        $debug = "$env:GITHUB_WORKSPACE\.vcpkg\installed\x64-windows\debug"
        Remove-Item $debug -Recurse -Force -ErrorAction SilentlyContinue

    # The port is patched first, to add `--enable-cuda-llvm` to what its
    # `nvcodec` feature passes FFmpeg's configure.
    #
    # The Linux backend composites on CUDA, and media-pp's compositor puts
    # every layer through `scale_cuda` on its way to the canvas, whatever its
    # size. That filter, like every CUDA filter, is built only when FFmpeg
    # can compile CUDA kernels — with clang (`cuda-llvm`) or NVIDIA's nvcc
    # (`cuda-nvcc`). The port configures with `--disable-autodetect` and
    # enables neither, so its `nvcodec` build had the CUDA device and NVENC
    # and no CUDA filters at all. The v0.2.0 draft archive shipped that: adding a Color
    # source stopped the compositor at its first frame with "filter
    # `scale_cuda` not found", the Preview froze, and the recording's
    # picture ended there while its sound ran on. No runner has a GPU, so
    # nothing in CI could see it — the check under Export FFMPEG_DIR is what
    # sees it now.
    #
    # clang rather than nvcc: nvcc makes the build `--enable-nonfree`, which
    # an archive cannot be distributed under, where `cuda-llvm` leaves the
    # licence LGPL. clang compiles the kernels to PTX at build time and the
    # driver loads them at run time, so there is no CUDA toolkit here either.
    #
    # Linux only. The Windows backend composites on D3D11 and uses no CUDA
    # filter, and building them there would put clang into an MSVC build for
    # nothing.
    #
    # The grep is what makes an edit to the pinned port fail here, loudly,
    # rather than build without the flag and ship the same archive again.
    - name: Install FFmpeg development libraries (Linux)
      if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        port="$GITHUB_WORKSPACE/.vcpkg/ports/ffmpeg/portfile.cmake"
        sed -i 's/--enable-ffnvcodec")/--enable-ffnvcodec --enable-cuda-llvm")/' "$port"
        grep -q -- '--enable-ffnvcodec --enable-cuda-llvm")' "$port" || {
          echo "the ffmpeg port's nvcodec options are not where this patch expects them" >&2
          exit 1
        }
        "$GITHUB_WORKSPACE/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        "$GITHUB_WORKSPACE/.vcpkg/vcpkg" install "ffmpeg[${{ inputs.vcpkg-features }}]:x64-linux-dynamic"
        rm -rf "$GITHUB_WORKSPACE/.vcpkg/installed/x64-linux-dynamic/debug"

    # Export `FFMPEG_DIR`, not `VCPKG_ROOT`: `ffmpeg-sys-next` reads it before
    # it attempts any vcpkg or pkg-config discovery, so the pinned tree becomes
    # the only FFmpeg the build can reach. Exporting `VCPKG_ROOT` alone left the
    # discovery order in play, and the first run of the docs workflow generated
    # bindings from FFmpeg 8.1 headers found elsewhere on the runner: `AVCodec`
    # had lost `pix_fmts`/`sample_fmts`/`ch_layouts` and `AV_CODEC_ID_V410` was
    # gone, which `ffmpeg-next` 8.1 uses unguarded.
    #
    # Runs on both paths, so a restored cache is checked as strictly as a fresh
    # build: a truncated or wrong-version tree fails here rather than halfway
    # through generating bindings from it.
    - name: Export FFMPEG_DIR (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $prefix = "$env:GITHUB_WORKSPACE\.vcpkg\installed\x64-windows"
        if (-not (Test-Path "$prefix\include\libavcodec\avcodec.h")) {
          throw "no FFmpeg headers under $prefix"
        }
        if (-not (Get-ChildItem "$prefix\lib\*avcodec*.lib" -ErrorAction SilentlyContinue)) {
          throw "no FFmpeg import libraries under $prefix"
        }
        # Recorded so a future header mismatch is diagnosable from the log.
        Get-ChildItem "$prefix\include\libavcodec\version*.h" |
          Select-String -Pattern '#define\s+LIBAVCODEC_VERSION_(MAJOR|MINOR)\s'
        "FFMPEG_DIR=$prefix" >> $env:GITHUB_ENV

        # The x64-windows triplet links FFmpeg dynamically: a test binary
        # resolves its avcodec/avutil/etc. DLLs from PATH at run time, not
        # from the import libraries used to link it. Without this, compiling
        # and linting still succeed but every test binary fails to start with
        # STATUS_DLL_NOT_FOUND.
        "$prefix\bin" >> $env:GITHUB_PATH

    - name: Export FFMPEG_DIR (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        FEATURES: ${{ inputs.vcpkg-features }}
      run: |
        set -euo pipefail
        prefix="$GITHUB_WORKSPACE/.vcpkg/installed/x64-linux-dynamic"
        if [ ! -f "$prefix/include/libavcodec/avcodec.h" ]; then
          echo "no FFmpeg headers under $prefix" >&2
          exit 1
        fi
        if ! compgen -G "$prefix/lib/libavcodec.so*" > /dev/null; then
          echo "no FFmpeg shared libraries under $prefix" >&2
          exit 1
        fi
        # Recorded so a future header mismatch is diagnosable from the log.
        grep -E '#define\s+LIBAVCODEC_VERSION_(MAJOR|MINOR)\s' \
          "$prefix"/include/libavcodec/version*.h
        # The filter the CUDA compositor scales with — see the Linux install
        # step. A filter's name is in libavfilter only if the filter was
        # built, so this tells the two builds apart without a GPU.
        if [[ ",$FEATURES," == *",nvcodec,"* ]] &&
          ! grep -qa scale_cuda "$prefix"/lib/libavfilter.so.*.*; then
          echo "FFmpeg under $prefix was built without its CUDA filters" >&2
          exit 1
        fi
        echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"

        # x64-linux-dynamic links FFmpeg as .so: a test binary resolves those
        # at run time through the loader's search path, not through the
        # import-time link. `PATH` is for executables only on Linux, so this
        # is `LD_LIBRARY_PATH`, the direct counterpart of the Windows PATH
        # fix above (same STATUS_DLL_NOT_FOUND-shaped failure otherwise).
        echo "LD_LIBRARY_PATH=$prefix/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

    # Only reached on a miss, after Export FFMPEG_DIR validated the tree, so
    # this never caches a truncated or wrong-version build. Runs before this
    # action returns control to the caller, so a later lint/test failure in
    # the calling job cannot prevent the save the way it did under the
    # deprecated `save-always` input.
    - name: Save FFmpeg development libraries to cache
      if: steps.ffmpeg.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .vcpkg/installed
        key: ${{ steps.key.outputs.key }}
