name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull-request run is wasted work; a superseded push to main
  # would leave that commit unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nothing here reuses a build directory across runs, so incremental
  # compilation only buys extra artifacts to write.
  CARGO_INCREMENTAL: "0"

jobs:
  # One job per platform rather than a matrix: the two differ in their system
  # dependencies, in which backend they compile (D3D11 against CUDA), and in
  # nothing else worth parameterising. A matrix would spend its `if:`s saying
  # so.
  windows:
    runs-on: windows-2025
    env:
      # Where `cef-dll-sys` looks for Chromium's binary distribution before
      # downloading it, and so what the cache step below fills — see
      # `src/browser` for what it is and `README.md` for why a build here
      # wants CMake at all.
      CEF_PATH: C:\cef
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # One command per step: GitHub's pwsh wrapper exits with the *last*
      # command's `$LASTEXITCODE` and a failing native command does not stop
      # the script, so a multi-command step swallows every failure but the
      # final one. This cost media-pp a rustdoc error that reached a release.
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default stable

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      # `cef-dll-sys` builds CEF's C++ wrapper with CMake, and names Ninja as
      # the generator in its own build script — so `CMAKE_GENERATOR` does not
      # stand in for it and one has to be on PATH. Visual Studio ships a copy
      # in a place nothing adds to PATH, so this installs one rather than
      # guessing at that path.
      - name: Set up Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      # Downloaded crate sources only, not `target`: the build directory for
      # this dependency graph runs to several gigabytes of small files, and
      # saving and restoring that on Windows costs more than recompiling it.
      # A stale entry here is only a slower build, never a wrong one, so this
      # one does take a prefix fallback.
      - name: Cache downloaded crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # A few hundred megabytes that change only when the pinned `cef`
      # version does, which is what `Cargo.lock` records. A miss costs a
      # download, never a wrong build: the build script checks the archive it
      # finds there and fetches a fresh one if it does not match.
      - name: Cache the browser engine
        uses: actions/cache@v4
        with:
          path: C:\cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cef-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The test binary links FFmpeg dynamically and finds its DLLs on PATH,
      # which `setup-ffmpeg` put there — see that action on why.
      - name: Test
        run: cargo test

  linux:
    runs-on: ubuntu-26.04
    env:
      # Where `cef-dll-sys` looks for Chromium's binary distribution before
      # downloading it, as on Windows. Beside the checkout rather than in it,
      # so a cache restore never lands inside the source tree.
      CEF_PATH: ${{ github.workspace }}/../cef
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # PipeWire is what desktop capture and audio go through. The rest is
      # what eframe's windowing needs to build; most of it is loaded through
      # `dlopen` at run time, but the headers have to be here to compile
      # against.
      #
      # No CUDA toolkit, and no CUDA at all: the CUDA backend opens the
      # driver when it first calls it, and a hosted runner has no NVIDIA GPU
      # to open. lavapipe — Mesa's Vulkan on the CPU — is what the tests
      # composite on instead, through the Vulkan backend a machine without
      # NVIDIA's driver gets. So this job proves the Linux build compiles
      # and the Vulkan path works, not that CUDA compositing does.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            mesa-vulkan-drivers \
            libvulkan1

      # `vulkan` on Linux alone, where the backend composites on it without
      # an NVIDIA GPU — see the action.
      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          vcpkg-features: openh264,nvcodec,vulkan

      - name: Cache downloaded crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # As on Windows: a few hundred megabytes that change only when the
      # pinned `cef` does. Linux needs no CMake or Ninja for it — the crate
      # links against libcef there rather than building CEF's C++ wrapper.
      - name: Cache the browser engine
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cef-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
