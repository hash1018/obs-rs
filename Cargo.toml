[package]
name = "obs-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# `wgpu` rather than the default `glow` backend: the preview will eventually
# receive frames as GPU textures imported from `media-pp`'s own device
# (D3D11 on Windows, CUDA/Vulkan on Linux, Metal on macOS), and that import
# goes through `wgpu-hal`. `x11`/`wayland` are eframe's own winit features,
# kept on so this still builds on Linux.
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
# Depended on directly, not just through eframe: the interop layer needs to
# name wgpu types, and its default features are what select the per-platform
# backends (DX12/Vulkan/Metal).
wgpu = "30"
# The engine thread publishes each composited frame into a slot the UI thread
# reads while drawing. A lock would put the UI behind whoever is uploading;
# this hands over a pointer instead.
arc-swap = "1"
fluent-bundle = "0.16.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unic-langid = "0.9.6"

# The pipeline library this application is built on. Taken by path rather
# than from crates.io: it is developed alongside obs-rs in the same tree, and
# the capture/compositor APIs used here move together with it.
[dependencies.media-pp]
path = "../media-pp/lib"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `async-io`, not the default `tokio` backend. `media-pp` runs its own portal
# handshake on this same crate and picks `async-io`; ashpd refuses to compile
# with both backends enabled, so the choice is the library's, not ours.
ashpd = { version = "0.13.13", default-features = false, features = [
    "async-io",
    "screencast",
] }
libloading = "0.8.9"
# Drives the portal handshake to completion on the picker's own thread. The
# same thing `media-pp` uses, and the reason no async runtime has to be
# installed to run this application.
pollster = "1"
x11rb = { version = "0.13.2", features = ["randr"] }

# `cuda` on both: the compositor, its download, and the frames between them
# are CUDA on every platform, because that is the only backend the engine has.
# It is not platform-gated in `media-pp` either. A Direct3D compositor would
# be the reason to make this a choice; until then it is not one, and Windows
# needs an NVIDIA GPU for the same reason Linux does.
#
# Capture backends are the part that genuinely differs per platform.
[target.'cfg(target_os = "linux")'.dependencies.media-pp]
path = "../media-pp/lib"
features = ["cuda", "pipewire-screen-capture"]

[target.'cfg(target_os = "windows")'.dependencies.media-pp]
path = "../media-pp/lib"
features = ["cuda", "dxgi-capture"]
