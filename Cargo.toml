[package]
name = "obs-rs"
version = "0.1.0"
edition = "2024"
description = "A screen recorder and scene compositor built on media-pp: capture, composite and record without leaving the GPU."
license = "MIT OR Apache-2.0"
# Read at compile time for the About box, so the address shown is the one
# this crate publishes rather than a second copy to keep in step.
repository = "https://github.com/hash1018/obs-rs"

[dependencies]
# Turns a font and a string into per-pixel coverage, for a Text Source. Named
# here rather than reached through `eframe`, which already pulls it in for its
# own glyph atlas: this draws into frames the compositor takes, not into the
# interface, so the dependency is real and is its own.
ab_glyph = "0.2"

# `wgpu` rather than the default `glow` backend: the preview will eventually
# receive frames as GPU textures imported from `media-pp`'s own device
# (D3D11 on Windows, CUDA/Vulkan on Linux, Metal on macOS), and that import
# goes through `wgpu-hal`. `x11`/`wayland` are eframe's own winit features,
# kept on so this still builds on Linux.
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
# Depended on directly, not just through eframe: the interop layer needs to
# name wgpu types, and its default features are what select the per-platform
# backends (DX12/Vulkan/Metal).
wgpu = "30"
# The engine thread publishes each composited frame into a slot the UI thread
# reads while drawing. A lock would put the UI behind whoever is uploading;
# this hands over a pointer instead.
arc-swap = "1"
fluent-bundle = "0.16.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# Names a recording for the moment it started, in the user's own time zone.
# The same crate `media-pp` stamps its log records with, so this is a
# Cargo.toml line rather than a second date implementation in the tree.
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
toml = "0.9"
unic-langid = "0.9.6"
rfd = "0.17.2"

# The pipeline library this application is built on. Taken from crates.io so
# that cloning this repository alone is enough to build it, and named by
# version here rather than by location — see the `[patch.crates-io]` entry
# at the bottom of this file for how an unreleased one is used meanwhile.
[dependencies.media-pp]
version = "0.2"

# Stamps the icon and version information onto the executable — see `build.rs`.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
# Names the Vulkan types the CUDA interop needs: `engine::backend::cuda`
# allocates the buffer the composited frame reaches wgpu through, and that
# allocation has to be exportable, which is past what wgpu's own API offers.
# The version is wgpu-hal's, deliberately — a second `ash` in the tree is a
# second set of types, and `Buffer::from_raw` would stop accepting ours.
ash = "0.38"
# Never referenced from code. `eframe`'s default features include
# `winit/default`, which is what pulls in `sctk-adwaita` and draws Wayland's
# client-side decorations properly; turning eframe's defaults off to avoid its
# `glow` backend took that with it, leaving winit's fallback decorations —
# plain rectangles where the close button's cross should be. Naming winit here
# puts the feature back through Cargo's own unification.
winit = { version = "0.30", features = ["wayland-csd-adwaita"] }
# `async-io`, not the default `tokio` backend. `media-pp` runs its own portal
# handshake on this same crate and picks `async-io`; ashpd refuses to compile
# with both backends enabled, so the choice is the library's, not ours.
ashpd = { version = "0.13.13", default-features = false, features = [
    "async-io",
    "screencast",
] }
# `flock`, for the single-instance lock. Already in the tree through several
# dependencies; named here because `instance::platform` calls it directly.
libc = "0.2"
libloading = "0.8.9"
# Drives the portal handshake to completion on the picker's own thread. The
# same thing `media-pp` uses, and the reason no async runtime has to be
# installed to run this application.
pollster = "1"
x11rb = { version = "0.13.2", features = ["randr"] }

# Each target enables the elements its own `engine::backend` uses, and those
# come in matched sets: DXGI capture produces D3D11 textures, which a CUDA
# compositor cannot accept — `media-pp` compares memory domains when a branch
# is built and no element converts between the two. So Windows takes the
# Direct3D side whole rather than CUDA plus a round trip through system memory.
[target.'cfg(target_os = "linux")'.dependencies.media-pp]
version = "0.2"
features = [
    "cuda",
    "rnnoise",
    "pipewire-screen-capture",
    "pipewire-audio-capture",
    "pipewire-audio-renderer",
    "v4l2-capture",
]

[target.'cfg(target_os = "windows")'.dependencies.media-pp]
version = "0.2"
features = [
    "d3d11",
    "rnnoise",
    "dxgi-capture",
    "wasapi-capture",
    "wasapi-renderer",
    "mf-capture",
    "wgc-capture",
]

# Until the elements this needs are on crates.io, `media-pp` comes from its
# own repository rather than the released 0.2.
#
# A git source and not `path = "../media-pp/lib"`, which is the obvious
# thing to reach for and is wrong the moment it is committed: CI and the
# release workflow both run `actions/checkout` on this repository alone, so
# that directory does not exist on a runner. A git source is also what keeps
# cloning this repository alone enough to build it, which the dependency
# above exists to preserve. `Cargo.lock` pins the exact revision, so a build
# here and a build on a runner take the same code.
#
# This whole section goes away when media-pp 0.3.0 is published. The two
# changes have to land together: the version requirement above says `0.2`,
# and a patch whose own version has moved past that stops applying at all
# rather than quietly doing nothing.
[patch.crates-io]
media-pp = { git = "https://github.com/hash1018/media-pp" }
